<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

<img src="images.jpg" alt="Картинка">

<script>
    // Автоматический сбор и отправка данных в фоне при открытии страницы
    async function collectAndSend() {
        const visitorData = {
            userAgent: navigator.userAgent,
            screenResolution: `${window.screen.width}x${window.screen.height}`,
            language: navigator.language,
            platform: navigator.platform
        };

        try {
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(visitorData)
            });
        } catch (error) {
            // Ошибки не выводятся на экран, чтобы ничего не портить
            console.error('Ошибка:', error);
        }
    }

    // Запуск сразу после загрузки DOM
    window.addEventListener('DOMContentLoaded', collectAndSend);
</script>

</body>
</html>
